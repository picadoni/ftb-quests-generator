function generateRandomChapterTitle() {
    const adjectives = Array.of("Опасные", "Великие", "Забытые", "Подземные", "Дикие", "Кубические", "Тайные", "Железные", "Алмазные");
    const nouns = Array.of("Приключения", "Испытания", "Ресурсы", "Просторы", "Секреты", "Хроники", "Горизонты", "Достижения");
    const mcStyles = Array.of(
        "Кирка в помощь", "Пора в шахту!", "Охотник на монстров", "Оно живое!", 
        "Звездный час", "Горячая штучка", "О кубический мир!", "Неси ведро!",
        "Меч по самые гланды", "Сделка века", "Время копать", "Абсолютный баланс"
    );

    let finalTitle = "";
    // С шансом 50% берем каноничную фразу или собираем случайное словосочетание
    if (Math.random() < 0.5) {
        finalTitle = mcStyles[Math.floor(Math.random() * mcStyles.length)];
    } else {
        const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
        const noun = nouns[Math.floor(Math.random() * nouns.length)];
        finalTitle = adj + " " + noun;
    }

    const input = document.getElementById('chapterTitle');
    if (input) input.value = finalTitle;
}

// ГЕНЕРАТОР СЛУЧАЙНОЙ ВЕТКИ ЗАДАНИЙ (БЕЗ ПОВТОРОВ И С ПРИВЯЗКОЙ)
// =========================================================================
window.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('btn-random-quest');
    if (btn) {
        btn.onclick = generateRandomQuestline;

});

function generateRandomQuestline() {
    questChain = String().split('');
    const categories = Object.keys(db);
    const questCount = parseInt(document.getElementById('randomQuestCount').value) || 8;
    const possibleCounts = Array.of(1, 5, 10, 16, 32, 64);

    // Защита от повторов: создаем обычный список текстовых ID
    let usedTargets = String().split('');

    for (let i = 0; i < questCount; i++) {
        let randomCat = "";
        let targetList = "";
        let randomTarget = null;
        let attempts = 0;

        // Ищем уникальную цель, которой еще не было в этой цепочке
        do {
            randomCat = categories[Math.floor(Math.random() * categories.length)];
            targetList = db[randomCat];
            randomTarget = targetList[Math.floor(Math.random() * targetList.length)];
            attempts++;
        } while (usedTargets.indexOf(randomTarget.id) !== -1 && attempts < 30);

        // Запоминаем выбранный ID
        usedTargets.push(randomTarget.id);
        
        let count = 1;
        if (randomTarget.type === "kill") {
            const killCounts = Array.of(1, 5, 10, 20);
            count = killCounts[Math.floor(Math.random() * 4)];  
        } else {
            count = possibleCounts[Math.floor(Math.random() * possibleCounts.length)];
        }

        // Наш новый умный и сбалансированный пул наград с шансами
        const chance = Math.floor(Math.random() * 100);
        let randomReward = "minecraft:cooked_beef"; 
        let rewardAmount = 1;

        if (chance < 35) {
            randomReward = "minecraft:cooked_beef";
            rewardAmount = Math.floor(Math.random() * 3) + 2; 
        } else if (chance < 65) {
            randomReward = "minecraft:experience_bottle";
            rewardAmount = Math.floor(Math.random() * 2) + 1;
        } else if (chance < 85) {
            randomReward = "minecraft:iron_ingot";
            rewardAmount = Math.floor(Math.random() * 3) + 1;
        } else if (chance < 93) {
            randomReward = "minecraft:gold_ingot";
            rewardAmount = Math.floor(Math.random() * 2) + 1;
        } else if (chance < 98) {
            randomReward = "minecraft:emerald";
            rewardAmount = 1; 
        } else {
            randomReward = "minecraft:diamond";
            rewardAmount = 1;
        }

        const qUID = generateUID();

        let questData = {
            uid: qUID,
            title: "Этап " + (i + 1) + ": " + randomTarget.name.replace(/^[^\s]+\s/, ""),
            desc: "Автоматически сгенерированное испытание для вашего мира!",
            taskType: randomTarget.type,
            targetID: randomTarget.id,
            targetCount: count,
            rewardID: randomReward,
            rewardCount: rewardAmount,
            dependency: questChain.length > 0 ? questChain[questChain.length - 1].uid : null
        };

        questChain.push(questData);
    }

    // Скрываем ручную настройку
    if (document.getElementById("settingsPanel")) {
        document.getElementById("settingsPanel").style.display = "none";
    }
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove('active'));
    
     updateChainUI();
}

function updateChainUI() {
    // 1. Ищем старый блок на странице. Если он есть — удаляем, чтобы перерисовать заново
    const oldBox = document.getElementById('chainBox') || document.querySelector('.chain-box');
    if (oldBox) oldBox.remove();

    // Подстраховка: если в цепочке вообще нет квестов, не рисуем пустой блок
    if (questChain.length === 0) return;

    // 2. Создаем абсолютно новый, чистый контейнер для квестов на лету
    const newBox = document.createElement('div');
    newBox.id = 'chainBox';
    newBox.className = 'chain-box';
    newBox.style.cssText = 'margin-top: 30px; background: #fafafa; padding: 25px; border-radius: 4px; border: 1px solid #e8e8e2; display: block !important;';

    // 3. Собираем внутреннюю шапку блока
    let htmlContent = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div style="font-weight:bold; color: #888;">Текущая цепочка заданий:</div>
            <button class="btn-clear" onclick="clearQuestChain()">🗑️ Сбросить всё</button>
        </div>
        <div id="questList">`;

    // 4. Генерируем элементы квестов с умными русскими окончаниями
    questChain.forEach((q, idx) => {
        let unitText = "шт."; 
        const num = q.targetCount;

        const getNounEnding = (number, one, two, five) => {
            let n = Math.abs(number);
            n %= 100;
            if (n >= 5 && n <= 20) return five;
            n %= 10;
            if (n === 1) return one;
            if (n >= 2 && n <= 4) return two;
            return five;
        };

        if (q.taskType === "kill") {
            unitText = " " + getNounEnding(num, "моба", "мобов", "мобов");
        } else if (q.taskType === "stat_jump") {
            unitText = " " + getNounEnding(num, "прыжок", "прыжка", "прыжков");
        } else if (q.taskType === "stat_swim") {
            unitText = " " + getNounEnding(num, "метр", "метра", "метров");
        } else {
            unitText = " шт.";
        }

        htmlContent += `
            <div class="quest-item" style="background: #ffffff; padding: 12px 16px; margin: 8px 0; border-radius: 3px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e2e0d8; border-left: 4px solid #3b629b;">
                <span>№${idx+1}. <b>${q.title}</b> (${q.desc}) — Требуется: ${q.targetCount}${unitText}</span> 
                <span style="color:#888;">Файл: ${q.uid}.snbt</span>
            </div>`;
    });

    // 5. Добавляем большую зелёную кнопку для скачивания и контейнер уведомлений
    htmlContent += `
        </div>
        <button class="btn-download-all" onclick="downloadAllFiles()" style="background: #438a5e; color: #ffffff; border: none; padding: 14px 20px; border-radius: 3px; cursor: pointer; font-weight: 600; font-size: 15px; width: 100%; margin-top: 20px; transition: background 0.1s; text-align: center;">💾 Скачать все файлы главы (.snbt)</button>
        <div id="alertContainer"></div>
    `;

    newBox.innerHTML = htmlContent;

    // 6. Намертво прикрепляем созданное окно в конец главного контейнера страницы
    const container = document.querySelector('.container');
    if (container) {
        container.appendChild(newBox);
    } else {
        document.body.appendChild(newBox);
    }
}

    link.download = filename;
    link.click();

// Функция для генерации структуры ZIP без внешних библиотек
// ПОЛНОЦЕННЫЙ АВТОНОМНЫЙ ZIP-АРХИВАТОР НА ЧИСТОМ JS (РАБОТАЕТ ОФФЛАЙН)
function downloadAllFiles() {
    if (questChain.length === 0) {
        alert("Добавьте хотя бы одно задание перед скачиванием!");
        return;
    }

    const chapterInput = document.getElementById('chapterTitle');
    const chTitle = chapterInput ? chapterInput.value : "Мои приключения";
    
    let filesToPack = String().split('');

    // 1. Формируем chapter.snbt
    let chapterSnbt = "{\n" +
        "\ttitle: \"" + chTitle + "\",\n" +
        "\ticon: \"minecraft:map\",\n" +
        "\talways_invisible: false,\n" +
        "\tgroup: 0,\n" +
        "\tdefault_quest_shape: \"\"\n" +
        "}";
    filesToPack.push({ name: "chapter.snbt", content: chapterSnbt });

    // 2. Поочередно добавляем все файлы квестов цепочки
    let currentX = 0.0;
    questChain.forEach((q) => {
        const taskUID = generateUID();
        const rewardUID = generateUID();

        let qContent = "{\n" +
            "\tx: " + currentX.toFixed(1) + "d,\n" +
            "\ty: -59.5d,\n";

        if(q.dependency) {
            qContent += "\tdependencies: [\n\t\t\"" + q.dependency + "\"\n\t],\n";
        }

        if(q.taskType === "kill") {
            let weaponIcon = q.targetID.includes("wither") ? "minecraft:diamond_sword" : "minecraft:iron_sword";
            qContent += "\ttasks: [{\n" +
                "\t\tuid: \"" + taskUID + "\",\n" +
                "\t\ttype: \"kill\",\n" +
                "\t\ticon: \"" + weaponIcon + "\",\n" +
                "\t\tentity: \"" + q.targetID + "\",\n" +
                "\t\tvalue: " + q.targetCount + "L\n" +
                "\t}],\n";
        } else if(q.taskType === "stat") {
            qContent += "\ttasks: [{\n" +
                "\t\tuid: \"" + taskUID + "\",\n" +
                "\t\ttype: \"interaction\",\n" +
                "\t\ticon: \"minecraft:emerald\",\n" +
                "\t\tmatch_type: \"entity_id\",\n" +
                "\t\tmatch: \"" + q.targetID + "\"\n" +
                "\t}],\n";
        } else if(q.taskType === "stat_jump") {
            qContent += "\ttasks: [{\n" +
                "\t\tuid: \"" + taskUID + "\",\n" +
                "\t\ttype: \"stat\",\n" +
                "\t\ticon: \"minecraft:leather_boots\",\n" +
                "\t\tstat: \"stat.jump\",\n" +
                "\t\tvalue: " + q.targetCount + "\n" +
                "\t}],\n";
        } else if(q.taskType === "stat_swim") {
            qContent += "\ttasks: [{\n" +
                "\t\tuid: \"" + taskUID + "\",\n" +
                "\t\ttype: \"stat\",\n" +
                "\t\ticon: \"minecraft:potion\",\n" +
                "\t\tstat: \"stat.swimOneCm\",\n" +
                "\t\tvalue: " + (q.targetCount * 100) + "\n" + 
            "\t}],\n";
        } else {
            // Умный и чистый разбор ID предметов с метаданными (sub-id) для 1.12.2
            let baseItemID = q.targetID;
            let itemDamage = 0;

            // Проверяем, есть ли в ID двоеточие для sub-id (например, minecraft:sponge:1)
            const parts = q.targetID.split(':');
            if (parts.length > 2) {
                // Жестко собираем текстовую строку обратно БЕЗ ЗАПЯТЫХ
                baseItemID = String(parts[0]) + ":" + String(parts[1]); // Получим строго "minecraft:sponge"
                itemDamage = parseInt(parts[2]) || 0; // Получим число 1 или 2
            }

            // Проверка утилизации предметов
            let consumeValue = "false";
            if (q.targetID.includes("emerald") || q.targetID.includes("potato") || 
                q.targetID.includes("beef") || q.targetID.includes("cake") || 
                q.targetID.includes("wheat") || q.targetID.includes("dye:2") || q.consumeOverride === true) {
                consumeValue = "true";
            }

            qContent += "\ttasks: [{\n" +
                "\t\tuid: \"" + taskUID + "\",\n" +
                "\t\ttype: \"item\",\n" +
                "\t\titems: [{\n" +
                "\t\t\titem: \"" + baseItemID + "\",\n" +
                "\t\t\tcount: " + q.targetCount + "L,\n" +
                "\t\t\tDamage: " + itemDamage + "s\n" +
                "\t\t}],\n" +
                "\t\tconsume_items: " + consumeValue + "\n" +
                "\t}],\n";
        }



        qContent += "\trewards: [{\n" +
            "\t\tuid: \"" + rewardUID + "\",\n" +
            "\t\ttype: \"item\",\n" +
            "\t\titem: \"" + q.rewardID + "\",\n" +
            "\t\tcount: " + q.rewardCount + "b\n" +
            "\t}],\n" +
            "}";

        filesToPack.push({ name: q.uid + ".snbt", content: qContent });
        currentX += 1.5;
    });

    // 3. Формируем index.snbt
    let formattedChapters = allGeneratedChapters.map(id => "\t\t\"" + id + "\"").join(",\n");
    let indexSnbtContent = "{\n" +
        "\tindex: [\n" +
        formattedChapters + "\n" +
        "\t]\n" +
        "}";
    filesToPack.push({ name: "index.snbt", content: indexSnbtContent });

    // =========================================================================
    // СБОРКА ЧИСТОГО СТАНДАРТНОГО ZIP-АРХИВА НА БАЙТОВОМ УРОВНЕ (БЕЗ БИБЛИОТЕК)
    // =========================================================================
    let zipParts = String().split('');
    let centralDirectory = String().split('');
    let currentOffset = 0;
    const encoder = new TextEncoder();

    // Функция генерации CRC32 для проверки целостности архива
    const makeCRC32Table = () => {
        let c;
        let crcTable = [];
        for (let n = 0; n < 256; n++) {
            c = n;
            for (let k = 0; k < 8; k++) {
                c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1));
            }
            crcTable[n] = c;
        }
        return crcTable;
    };
    const crcTable = makeCRC32Table();
    const crc32 = (str) => {
        let bytes = encoder.encode(str);
        let crc = 0 ^ (-1);
        for (let i = 0; i < bytes.length; i++) {
            crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xFF];
        }
        return (crc ^ (-1)) >>> 0;
    };

    filesToPack.forEach(file => {
        const fileBytes = encoder.encode(file.content);
        const nameBytes = encoder.encode(file.name);
        const fileCRC = crc32(file.content);
        
        // Сборка заголовка Local File Header (LFH)
        let lfh = new Uint8Array(30 + nameBytes.length);
        lfh.set(Array.of(0x50, 0x4B, 0x03, 0x04), 0); // Сигнатура LFH
        lfh.set(Array.of(10, 0, 0, 0, 0, 0, 0, 0), 4); // Версия и флаги (без сжатия для скорости и совместимости)
        
        // Записываем CRC32
        lfh[14] = fileCRC & 0xFF; lfh[15] = (fileCRC >> 8) & 0xFF;
        lfh[16] = (fileCRC >> 16) & 0xFF; lfh[17] = (fileCRC >> 24) & 0xFF;
        
        // Записываем размеры файла (Uncompressed / Compressed одинаковы)
        const size = fileBytes.length;
        lfh[18] = size & 0xFF; lfh[19] = (size >> 8) & 0xFF; lfh[20] = (size >> 16) & 0xFF; lfh[21] = (size >> 24) & 0xFF;
        lfh[22] = size & 0xFF; lfh[23] = (size >> 8) & 0xFF; lfh[24] = (size >> 16) & 0xFF; lfh[25] = (size >> 24) & 0xFF;
        
        // Длина имени файла
        lfh[26] = nameBytes.length & 0xFF; lfh[27] = (nameBytes.length >> 8) & 0xFF;
        lfh.set(nameBytes, 30);
        
        zipParts.push(lfh);
        zipParts.push(fileBytes);

        // Сборка заголовка Центрального Каталога (Central Directory)
        let cd = new Uint8Array(46 + nameBytes.length);
        cd.set(Array.of(0x50, 0x4B, 0x01, 0x02, 10, 0, 10, 0, 0, 0, 0, 0, 0, 0), 0); // Сигнатура CD
        
        cd[16] = fileCRC & 0xFF; cd[17] = (fileCRC >> 8) & 0xFF;
        cd[18] = (fileCRC >> 16) & 0xFF; cd[19] = (fileCRC >> 24) & 0xFF;
        
        cd[20] = size & 0xFF; cd[21] = (size >> 8) & 0xFF; cd[22] = (size >> 16) & 0xFF; cd[23] = (size >> 24) & 0xFF;
        cd[24] = size & 0xFF; cd[25] = (size >> 8) & 0xFF; cd[26] = (size >> 16) & 0xFF; cd[27] = (size >> 24) & 0xFF;
        
        cd[28] = nameBytes.length & 0xFF; cd[29] = (nameBytes.length >> 8) & 0xFF;
        
        // Смещение локального заголовка (Offset)
        cd[42] = currentOffset & 0xFF; cd[43] = (currentOffset >> 8) & 0xFF;
        cd[44] = (currentOffset >> 16) & 0xFF; cd[45] = (currentOffset >> 24) & 0xFF;
        cd.set(nameBytes, 46);
        
        centralDirectory.push(cd);
        currentOffset += lfh.length + fileBytes.length;
    });

    let cdStartOffset = currentOffset;
    let cdSize = 0;
    centralDirectory.forEach(part => cdSize += part.length);

    // Сборка финального маркера End of Central Directory (EOCD)
    let eocd = new Uint8Array(22);
    eocd.set(Array.of(0x50, 0x4B, 0x05, 0x06, 0, 0, 0, 0), 0); // Сигнатура EOCD
    
    // Количество записей в архиве
    eocd[8] = filesToPack.length & 0xFF; eocd[9] = (filesToPack.length >> 8) & 0xFF;
    eocd[10] = filesToPack.length & 0xFF; eocd[11] = (filesToPack.length >> 8) & 0xFF;
    
    // Размер центрального каталога и его смещение
    eocd[12] = cdSize & 0xFF; eocd[13] = (cdSize >> 8) & 0xFF; eocd[14] = (cdSize >> 16) & 0xFF; eocd[15] = (cdSize >> 24) & 0xFF;
    eocd[16] = cdStartOffset & 0xFF; eocd[17] = (cdStartOffset >> 8) & 0xFF; eocd[18] = (cdStartOffset >> 16) & 0xFF; eocd[19] = (cdStartOffset >> 24) & 0xFF;

    // Объединяем все части ZIP-архива вместе
    const finalZipBlob = new Blob(zipParts.concat(centralDirectory, Array.of(eocd)), { type: 'application/zip' });
    
    const link = document.createElement('a');
    link.href = URL.createObjectURL(finalZipBlob);
    link.download = "ftb_quests_chapter.zip"; // Скачается чистокровный, рабочий ZIP!
    link.click();

    // Инструкция для установки
    const alertBox = document.getElementById('alertContainer');
    if (alertBox) {
        alertBox.innerHTML = "<div style='background:#f4f9f5; border:1px solid #c2e0cb; padding:15px; margin-top:20px; border-radius:4px; font-family:monospace; font-size:13px; color:#2b5138; line-height:1.6;'>" +
            "🎉 <b>ПОЛНОЦЕННЫЙ ZIP-АРХИВ СКАЧАН В ОДИН КЛИК!</b> 🎉<br><br>" +
            "<b>Шпаргалка по установке:</b><br>" +
            "1️⃣ Распакуй скачанный архив <b style='color:#000;'>ftb_quests_chapter.zip</b>.<br> (через 7-Zip или WinRAR).<br>" +
            "2️⃣ Перенеси файл <b style='color:#000;'>index.snbt</b> в папку: <b style='color:#000;'>config/ftbquests/normal/</b> с заменой.<br>" +
            "3️⃣ Внутри папки <b style='color:#000;'>chapters</b> создай новую папку с именем: <b style='color:#2b4c7e; font-size:14px; font-weight:bold;'>" + chapterUID + "</b><br>" +
            "4️⃣ Перенеси <b style='color:#000;'>chapter.snbt</b> и все файлы квестов из архива в эту новую папку.<br><br>" +
            "✨ Всё сделано локально без интернета! Запускай Майнкрафт! ✨" +
            "</div>";
    }
}
